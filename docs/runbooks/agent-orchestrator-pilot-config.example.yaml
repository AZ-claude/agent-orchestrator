version: 1
pilot:
  targetRepo: /Users/eita/projects/slot
  baseBranch: main
  manifestPath: tasks/agent-orchestrator-pilot.yaml
  boardPath: docs/runbooks/agent-orchestrator-pilot.md
stateRoot: /Users/eita/.local/state/agent-orchestrator-pilot
pollIntervalMs: 30000
maxLunaWorkers: 2
maxResumeAttempts: 2
retryIntervalMs: 300000
worker:
  mode: auto
  primary: cloud
  recovery: cloud
  local:
    executable: /Users/eita/.opencode/bin/opencode
    model: ollama/qwen3.8:latest
    contextTokens: 262144
    workdir: /Users/eita/.local/share/agent-orchestrator/targets/pilot
    ollamaBaseUrl: http://127.0.0.1:11434
    configPath: /Users/eita/.config/opencode/opencode.jsonc
    leasePath: /Users/eita/.local/state/ollama-inference/lease
runtime:
  target: pilot
  disposable:
    targetRepo: /tmp/agent-orchestrator-disposable-target
    baseBranch: main
    githubRepo: YOUR_ORG/agent-orchestrator-disposable
    allowedRoots: [/tmp]
  pilot:
    enabled: false
    targetRepo: /Users/eita/.local/share/agent-orchestrator/targets/pilot
    baseBranch: main
    githubRepo: AZ-claude/agent-orchestrator-pilot
  production:
    enabled: false
    targetRepo: /Users/eita/.local/share/agent-orchestrator/targets/slot
    baseBranch: master
    githubRepo: AZ-claude/slot
